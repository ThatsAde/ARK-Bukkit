[versions]
java = "25"
paper = "26.2.build.+"
junit = "5.11.4"
archunit = "1.3.0"
jqwik = "1.9.2"
testcontainers = "1.20.4"
spotless = "6.25.0"
shadow = "9.6.1"
runpaper = "3.1.0"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }

archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }

testcontainers-mariadb = { module = "org.testcontainers:mariadb", version.ref = "testcontainers" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
runpaper = { id = "xyz.jpenilla.run-paper", version.ref = "runpaper" }